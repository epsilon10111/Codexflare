name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-windows.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONUTF8: '1'
      - run: node --test tests/test_*.cjs
        env:
          PYTHONUTF8: '1'
