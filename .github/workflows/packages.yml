name: Release packages
on:
  workflow_dispatch:
  push:
    branches: [codex/fix-renderer-freeze]
permissions:
  contents: read
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build-macos.txt
      - run: brew install ffmpeg
      - run: python -m unittest discover -s tests -v
      - run: python tools/macos_editor_smoke.py
      - run: python tools/build_dmg.py --release
      - name: Verify relocated packaged editor
        run: |
          mkdir -p work/mounted
          hdiutil attach dist/Codexflare-*-macOS-arm64.dmg -readonly -nobrowse -mountpoint work/mounted
          ditto work/mounted/Codexflare.app work/Codexflare-validation.app
          hdiutil detach work/mounted
          codesign --verify --deep --strict work/Codexflare-validation.app
          work/Codexflare-validation.app/Contents/MacOS/Codexflare --self-check
          work/Codexflare-validation.app/Contents/MacOS/Codexflare --smoke-test --output work/packaged-macos-editor
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-editor-evidence
          path: |
            work/macos-editor/result.json
            work/macos-editor/*.png
            work/packaged-macos-editor/result.json
            work/packaged-macos-editor/*.png
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-windows.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/windows_editor_smoke.py
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-source
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-editor-evidence
          path: |
            work/windows-editor-*/result.json
            work/windows-editor-*/*.png
